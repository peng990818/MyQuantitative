name: quant
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pandas
  - "numpy<2"      # 保持锁定，防止新版 Numpy 不兼容 pandas_ta
  - pip
  - pandas-ta
  - pip:
      - ccxt                # 交易核心
      - python-dotenv       # 管理 .env (必须有)
      - pysocks             # M4 芯片代理支持 (必须有)
      - google-generativeai # [新增] Gemini AI 的官方 SDK
      - schedule            # [新增] 用于每分钟执行一次任务
      - requests            # [新增] 基础网络请求库
      - openai