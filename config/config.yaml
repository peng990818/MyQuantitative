# config/config.yaml

# === 基础设置 ===
project_name: "QuantBot v2.0"
run_mode: "PAPER"  # PAPER(模拟) | REAL(实盘)
log_level: "INFO"

# === 交易标的与周期 ===
symbols: ["BTC/USDT"]
timeframe: "1h"

# === 资金管理 (复利系统) ===
money_management:
  mode: "compound"       # compound(复利) | fixed(单利)
  risk_per_trade: 0.98    # 复利模式：每次投入总权益的 10%
#  fixed_qty: 0.1
#  mode: "fixed"

# === 智能代理 ===
proxy:
  enabled: true
  port: 7897             # 本地代理端口
  host: "127.0.0.1"

# === AI 模型配置 ===
ai:
  provider: "deepseek"   # deepseek | gemini | openai
  model_name: "deepseek-chat"

scoring:
  weights:
    technical: 0.4
    sentiment: 0.4
    trend: 0.2

  # 🔥 [修改] 统一改为 0-100 分制
  thresholds:
    buy: 75.0
    sell: 30.0

# 回测时 AI 分数为 0，必须提高技术和趋势的权重，否则无法触发交易
scoring_backtest:
  weights:
    technical: 0.8   # 🔥 没了 AI，RSI 必须挑大梁
    sentiment: 0.0   # 💀 强制归零，防止拖后腿
    trend: 0.2       # 趋势辅助
  thresholds:
    buy: 60.0        # 🔥 回测门槛稍微放宽 (纯技术面很难达到 75)
    sell: 40.0

notification:
  email:
    enabled: true
    smtp_server: "smtp.gmail.com"
    smtp_port: 587

risk_management:
  stop_loss: 0.03
  take_profit: 0.05

# ==========================================
# 🎯 策略参数仓库 (Strategy Parameters)
# ==========================================
strategy_params:
  # 📋 定义高波动币种列表 (自动匹配 Volatile 参数)
  volatile_symbols: ["ETH", "SOL", "DOGE", "PEPE", "SHIB", "AVAX", "NEAR"]

  # 🔹 模板 A: 标准参数 (适用于 BTC)
  default:
    sl_bull: 0.07           # 牛市止损 7%
    sl_bear: 0.05           # 熊市止损 5%
    sl_shock: 0.04          # 震荡止损 4%

    bull_rsi_entry: 70      # 牛市 RSI 入场上限
    bear_rsi_entry: 20      # 熊市 RSI 入场上限
    shock_rsi_entry: 40     # 震荡 RSI 入场上限

    shock_min_width: 0.04   # 震荡最小布林带宽
    ema_entry_buffer: 1.015 # EMA 挂单缓冲 (1.5%)

  # 🔸 模板 B: 高波动参数 (适用于山寨币)
  volatile:
    sl_bull: 0.12           # 放宽到 12%
    sl_bear: 0.08
    sl_shock: 0.06

    bull_rsi_entry: 75
    bear_rsi_entry: 25
    shock_rsi_entry: 45

    shock_min_width: 0.06
    ema_entry_buffer: 1.025